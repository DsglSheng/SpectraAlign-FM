[project]
name = "spectraalign-fm"
version = "0.1.0"
description = "Metadata-conditioned foundation model for hyperspectral remote sensing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "h5py>=3.10,<4",
    "numpy>=1.26,<3",
    "netCDF4>=1.7,<2",
    "rasterio>=1.4,<2",
    "requests>=2.32,<3",
    "scikit-learn>=1.4,<2",
    "scipy>=1.13,<2",
    "torch>=2.5,<3",
]

[project.optional-dependencies]
experiments = [
    "joblib>=1.3,<2",
    "matplotlib>=3.8,<4",
    "opencv-python-headless>=4.9,<5",
    "pandas>=2.1,<3",
    "pillow>=10",
    "tifffile>=2024.2.12",
    "torchvision>=0.20,<1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
license-files = ["DINOV3_LICENSE.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aware_open*", "dinov3*"]
